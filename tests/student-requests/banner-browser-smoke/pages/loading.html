<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Banner loading</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #f5f7f6; color: #0f3d2e; }
    main { max-width: 42rem; margin: 0 auto; padding: 1rem; width: 100%; overflow-x: hidden; }
    .card { background: #fff; border: 1px solid #d9e0dc; border-radius: .75rem; padding: 1rem; margin-top: .75rem; }
    .muted { color: #667; font-size: .875rem; }
    .loader { width: 1.5rem; height: 1.5rem; border: 2px solid #ccc; border-top-color: #0f3d2e; border-radius: 50%; animation: spin 1s linear infinite; margin: 1rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    button.retry { min-height: 44px; margin-top: .5rem; padding: 0 .75rem; border-radius: .5rem; border: 1px solid #f59e0b; background: #fffbeb; color: #92400e; font-weight: 700; cursor: pointer; }
    .rose { background: #ffe4e6; border: 1px solid #fecdd3; color: #881337; border-radius: .75rem; padding: 1rem; }
    .amber { background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; border-radius: .75rem; padding: .75rem; }
  </style>
</head>
<body>
<main id="app"><h1>جارٍ التحقق</h1>
   <div role="status" class="card muted" data-testid="loading"><div class="loader" aria-busy="true"></div>جارٍ التحقق من أهلية الخدمة…</div>
   <div data-testid="notice"><div class="space-y-2 "><div dir="rtl" role="note" class="rounded-lg border border-blue-200 bg-blue-50 p-3 text-xs text-blue-900"><div class="font-bold mb-1">معلومات الخدمة</div><ul class="list-disc list-inside space-y-0.5"><li>هذا الطلب مخصص لطلاب غير الخريجين.</li><li>شهادة القيد خدمة داخلية للكلية ولا تحتاج توقيعات مركزية.</li></ul></div><div dir="rtl" role="status" class="rounded-lg border border-amber-200 bg-amber-50/70 text-amber-900 p-3 text-xs space-y-1"><div class="flex items-center gap-1.5 font-bold"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-question-mark h-3.5 w-3.5" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg><span>تعذر إكمال التحقق من خدمة «شهادة قيد»</span></div><ul class="list-disc list-inside space-y-0.5 opacity-90"><li>لم يُتحقق بعد من حالة الطالب (نشط/خريج) في الواجهة.</li></ul></div></div></div>
<div id="smoke-flag" data-smoke-json="{&quot;hasRose&quot;:false,&quot;hasAmber&quot;:true,&quot;ariaBusy&quot;:true}"></div>
</main>
<script></script>
</body>
</html>
