<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08384E" />
    <title>غير متصل — بوابة الطالب</title>
    <style>
      *{box-sizing:border-box}
      html,body{margin:0;padding:0;height:100%}
      body{
        font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
        background:#08384E; color:#fff;
        display:flex; align-items:center; justify-content:center; padding:24px;
      }
      .card{
        max-width:380px; width:100%; text-align:center;
        background:rgba(255,255,255,0.05); border:1px solid rgba(217,154,23,0.35);
        border-radius:18px; padding:28px 22px;
      }
      .icon{
        width:64px;height:64px;border-radius:16px;background:#D99A17;color:#102333;
        margin:0 auto 16px;display:grid;place-items:center;font-size:30px;font-weight:800;
      }
      h1{margin:0 0 8px;font-size:20px;font-weight:800;color:#D99A17}
      p{margin:0 0 18px;font-size:13px;line-height:1.6;color:rgba(255,255,255,0.78)}
      button{
        background:#D99A17;color:#102333;border:0;border-radius:10px;
        padding:12px 22px;font-weight:800;font-size:14px;cursor:pointer;
      }
      small{display:block;margin-top:14px;color:rgba(255,255,255,0.5);font-size:11px}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">!</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذّر تحميل الصفحة لأن جهازك غير متصل بالشبكة. يرجى التحقق من الاتصال ثم المحاولة مرة أخرى.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
      <small>بوابة الطالب — كلية تكنولوجيا المعلومات وعلوم الحاسوب</small>
    </main>
  </body>
</html>
