name: Android Build — بوابة الطالب

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Debug + Release APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Build web assets (Vite)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Verify toolchain versions
        run: |
          node --version
          bun --version
          ./node_modules/.bin/cap --version

      - name: Ensure Android platform skeleton
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew missing — regenerating Android platform"
            rm -rf android
            ./node_modules/.bin/cap add android
          else
            echo "android/gradlew present — skipping cap add android"
          fi

      - name: Verify Android platform skeleton
        run: |
          test -f android/gradlew || (echo "gradlew missing after cap add" && exit 1)
          ls -la android/gradlew

      - name: Ensure Capacitor Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Capacitor sync
        run: ./node_modules/.bin/cap sync android

      - name: Apply frozen Android identity (fails closed)
        run: node scripts/mobile/apply-android-identity.mjs

      - name: Apply college branding (icons / splash)
        run: node scripts/mobile/apply-android-branding.mjs

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Debug AAB
        working-directory: android
        run: ./gradlew bundleDebug --no-daemon --stacktrace


      - name: Build Release APK (unsigned — keystore not configured)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Build Release AAB (unsigned)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: List build outputs
        run: |
          echo "=== APK outputs ==="
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print -exec ls -lh {} \; || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release AAB (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
