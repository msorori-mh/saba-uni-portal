name: Android Build — بوابة الطالب

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "resources/android/**"
      - "scripts/mobile/**"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Debug + Release APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-provider: basic

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Build web assets (Vite)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Verify toolchain versions
        run: |
          node --version
          bun --version
          ./node_modules/.bin/cap --version

      - name: Ensure Android platform skeleton
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew missing — regenerating Android platform"
            rm -rf android
            ./node_modules/.bin/cap add android
          else
            echo "android/gradlew present — skipping cap add android"
          fi

      - name: Verify Android platform skeleton
        run: |
          test -f android/gradlew || (echo "gradlew missing after cap add" && exit 1)
          ls -la android/gradlew

      - name: Ensure Capacitor Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Capacitor sync
        run: ./node_modules/.bin/cap sync android

      - name: Apply frozen Android identity (fails closed)
        run: node scripts/mobile/apply-android-identity.mjs

      - name: Apply college branding (icons / splash)
        run: node scripts/mobile/apply-android-branding.mjs

      - name: Prepare release signing (all-or-none)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          present=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done

          if [ "$present" -eq 0 ]; then
            echo "RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Release signing secrets are absent; debug and unsigned release artifacts will be built."
          elif [ "$present" -ne 4 ]; then
            echo "Partial Android signing configuration detected; refusing an ambiguous release." >&2
            exit 1
          else
            keystore_path="$RUNNER_TEMP/usr-portal-upload.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            test -s "$keystore_path"
            echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "Release signing configuration is complete."
          fi

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Verify Gradle wrapper
        working-directory: android
        run: ./gradlew --version --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Debug AAB
        working-directory: android
        run: ./gradlew bundleDebug --no-daemon --stacktrace


      - name: Build Release APK (signed when secrets are configured)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB (signed when secrets are configured)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: List build outputs
        run: |
          echo "=== APK outputs ==="
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print -exec ls -lh {} \; || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f -- "$ANDROID_KEYSTORE_PATH"
          fi
