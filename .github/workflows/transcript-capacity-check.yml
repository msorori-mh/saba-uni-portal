name: Transcript capacity SQL

on:
  pull_request:
    paths:
      - "supabase/migrations/20260910080000_transcript_per_enrollment_aggregation.sql"
      - "tests/performance/transcript-capacity-04.sql"
      - "tests/performance/fixtures/transcript-before-04.sql"
      - ".github/workflows/transcript-capacity-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transcript_capacity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify real SQL results, invoker RLS and bounded scan
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d transcript_capacity_test -v ON_ERROR_STOP=1 -f tests/performance/transcript-capacity-04.sql
