name: LOVABLE-EXIT-02 cutover source checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-production.yml'
      - '.github/workflows/lovable-exit-cutover-checks.yml'
      - 'scripts/production/**'
      - 'src/integrations/supabase/staging-isolation.ts'
      - 'src/lib/native/file-redirect.ts'
      - 'vite.config.ts'
      - 'tests/security/**'
      - 'tests/mobile/**'
      - 'tests/student-requests/**'

permissions:
  contents: read

jobs:
  source-checks:
    if: github.head_ref == 'codex/lovable-exit-cutover'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test tests/security tests/mobile tests/student-requests
      - run: git diff --check
