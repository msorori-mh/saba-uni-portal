name: Migration Review

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migration-review.yml"
      - ".github/migration-review-allowlist.txt"

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Review SQL migrations (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed migration files
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          mapfile -t FILES < <(git diff --name-only "$BASE" "$HEAD" -- 'supabase/migrations/' | grep -E '\.sql$' || true)

          if [ "${#FILES[@]}" -eq 0 ] || [ -z "${FILES[0]}" ]; then
            echo "No migration files changed in this PR."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "count=${#FILES[@]}" >> "$GITHUB_OUTPUT"
          {
            echo "Changed migration files (${#FILES[@]}):"
            printf '  - %s\n' "${FILES[@]}"
          } | tee "$GITHUB_STEP_SUMMARY"

          {
            echo "files<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Scan for dangerous SQL patterns
        if: steps.changed.outputs.count != '0'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          mapfile -t FILES < <(git diff --name-only "$BASE" "$HEAD" -- 'supabase/migrations/' | grep -E '\.sql$' || true)

          # Patterns that require explicit human review before merge.
          PATTERNS=(
            'DROP[[:space:]]+TABLE'
            'TRUNCATE[[:space:]]+'
            'DISABLE[[:space:]]+ROW[[:space:]]+LEVEL[[:space:]]+SECURITY'
            'DROP[[:space:]]+POLICY'
            'DELETE[[:space:]]+FROM'
            'UPDATE[[:space:]]+auth\.users'
          )

          ALLOWLIST=".github/migration-review-allowlist.txt"
          FOUND=0
          ALLOWLISTED=0
          REPORT="$RUNNER_TEMP/migration-review.txt"
          : > "$REPORT"

          trim() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }

          file_has_trimmed_line() {
            local file="$1"
            local want="$2"
            local raw
            while IFS= read -r raw || [ -n "${raw:-}" ]; do
              if [ "$(trim "$raw")" = "$want" ]; then
                return 0
              fi
            done < "$file"
            return 1
          }

          # Allowlist applies only to DELETE FROM, and only for exact file+line fingerprints.
          is_delete_allowlisted() {
            local file="$1"
            local line
            line="$(trim "$2")"
            [ -f "$ALLOWLIST" ] || return 1
            local afile aline
            while IFS=$'\t' read -r afile aline || [ -n "${afile:-}" ]; do
              case "$afile" in
                ''|\#*) continue ;;
              esac
              aline="$(trim "$aline")"
              if [ "$file" = "$afile" ] && [ "$line" = "$aline" ]; then
                return 0
              fi
            done < "$ALLOWLIST"
            return 1
          }

          # Fail closed if an allowlist fingerprint no longer exists in its file.
          if [ -f "$ALLOWLIST" ]; then
            while IFS=$'\t' read -r afile aline || [ -n "${afile:-}" ]; do
              case "$afile" in
                ''|\#*) continue ;;
              esac
              aline="$(trim "$aline")"
              if [ ! -f "$afile" ]; then
                echo "Allowlist references missing file: $afile" >> "$REPORT"
                FOUND=1
                continue
              fi
              if ! file_has_trimmed_line "$afile" "$aline"; then
                echo "Stale allowlist entry (line not found): $afile — $aline" >> "$REPORT"
                FOUND=1
              fi
            done < "$ALLOWLIST"
          fi

          for file in "${FILES[@]}"; do
            [ -f "$file" ] || continue
            for pattern in "${PATTERNS[@]}"; do
              while IFS= read -r match || [ -n "${match:-}" ]; do
                [ -z "$match" ] && continue
                lineno="${match%%:*}"
                content="${match#*:}"
                if [ "$pattern" = 'DELETE[[:space:]]+FROM' ] && is_delete_allowlisted "$file" "$content"; then
                  echo "ℹ️  allowlisted DELETE FROM: $file:$lineno" >> "$REPORT"
                  ALLOWLISTED=$((ALLOWLISTED + 1))
                  continue
                fi
                echo "$match"
                echo "⚠️  $file:$lineno — matched: $pattern" >> "$REPORT"
                FOUND=1
              done < <(grep -Ein "$pattern" "$file" || true)
            done
          done

          if [ "$ALLOWLISTED" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Allowlisted DELETE FROM matches: $ALLOWLISTED (see \`.github/migration-review-allowlist.txt\`)." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ⚠️ Dangerous SQL patterns detected" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This check flags risky statements for manual review. Resolve or justify before merging." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Dangerous SQL patterns found in changed migrations (see job summary)."
            exit 1
          fi

          echo "No dangerous SQL patterns detected in changed migrations." >> "$GITHUB_STEP_SUMMARY"
