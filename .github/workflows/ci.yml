name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "supabase/**"
      - "docs/migration-drafts/**"
      - "docs/drafts/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.*.json"
      - "eslint.config.js"
      - ".github/workflows/ci.yml"
  # Open PR trigger (no main-only filter) preserves stacked councils/GA CI.
  # workflow_dispatch preserves GA promotion manual verification.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Install · Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (advisory)
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.lint?0:1)"; then
            set +e
            bun run lint
            LINT_EXIT=$?
            set -e
            if [ "$LINT_EXIT" -ne 0 ]; then
              MSG="Lint failed but is non-blocking during initial Production Hardening CI rollout. Formatting cleanup will be handled separately."
              echo "$MSG"
              echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Lint passed."
            fi
          else
            echo "No lint script in package.json — skipped."
          fi

      - name: Typecheck
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.typecheck?0:1)"; then
            bun run typecheck
          else
            echo "typecheck script not found; skipping"
            echo "typecheck script not found; skipping" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        if: ${{ hashFiles('package.json') != '' }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.build?0:1)"; then
            bun run build
          else
            echo "::error::No build script in package.json"
            exit 1
          fi

  bun-tests:
    name: Bun tests (tests/) · diagnostic shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 5, 9, 13]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Package 97 PG17 smoke requires the exact postgres:17 image on the runner
      # (fail-closed when missing). Pull + inspect before tests; do not use latest.
      # Councils PR306 PostgREST HTTP auth matrix also needs postgrest/postgrest.
      - name: Provision PostgreSQL 17 and PostgREST images
        run: |
          set -euo pipefail
          docker pull postgres:17
          docker image inspect postgres:17
          docker pull postgrest/postgrest:v12.2.3
          docker image inspect postgrest/postgrest:v12.2.3

      # Fail-closed: any failing test in any tests/ suite fails this job.
      # The discovery guard also fails the job if the suites ever go missing
      # (e.g. a path rename), so the job can never silently become a no-op.
      # The LONGRUN-14 operator architecture tests run in their own PG17 job
      # because they require a provisioned local fixture and role lifecycle.
      - name: Run all bun test suites (fail-closed)
        run: |
          set -euo pipefail
          mapfile -t ALL_TEST_FILES < <(find tests \( -name '*.test.ts' -o -name '*.test.tsx' \) | grep -v 'b1-definitive-operator-architecture-14' | sort)
          TOTAL=${#ALL_TEST_FILES[@]}
          SHARD=${{ matrix.shard }}
          TEST_FILES=()
          for ((INDEX=0; INDEX<TOTAL; INDEX++)); do
            if (( INDEX % 16 == SHARD )); then
              TEST_FILES+=("${ALL_TEST_FILES[$INDEX]}")
            fi
          done
          COUNT=${#TEST_FILES[@]}
          echo "Discovered $TOTAL total test files; diagnostic shard $SHARD contains $COUNT files"
          if [ "$TOTAL" -eq 0 ] || [ "$COUNT" -eq 0 ]; then
            echo "::error::No test files found for diagnostic shard $SHARD — refusing to pass vacuously"
            exit 1
          fi
          bun test "${TEST_FILES[@]}"

  # LONGRUN-14: definitive B1 operator architecture — real 267 RPC authorization
  # execution against a disposable postgres:17 fixture. The fixture is built from
  # a tracked schema snapshot + canonical-fixture source files; generated output
  # is gitignored. Migrations are never rewritten.
  b1-definitive-operator-architecture-14:
    name: B1 Definitive Operator Architecture — LONGRUN-14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure psql client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Build canonical B1 execution fixture
        run: bun scripts/b1-definitive-operator-architecture-14/build-canonical-b1-fixture.ts

      - name: Load fixture into PG17
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 54329 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/b1-definitive-operator-architecture-14/generated/canonical-b1-fixture.sql

      - name: Provision operator role and observer functions
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 54329 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/b1-definitive-operator-architecture-14/operator-role/01-preflight.sql
          psql -h 127.0.0.1 -p 54329 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/b1-definitive-operator-architecture-14/operator-role/02-provision.sql
          psql -h 127.0.0.1 -p 54329 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/b1-definitive-operator-architecture-14/observer/01-observer-functions.sql
          psql -h 127.0.0.1 -p 54329 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/b1-definitive-operator-architecture-14/harness/00-harness-functions.sql
          psql -h 127.0.0.1 -p 54329 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/b1-definitive-operator-architecture-14/operator-role/03-post-verifier.sql

      - name: Run LONGRUN-14 267-case authorization harness
        run: |
          set -euo pipefail
          bun test tests/b1-definitive-operator-architecture-14/architecture-14.test.ts

      - name: Run LONGRUN-14 failure-injection matrix
        run: |
          set -euo pipefail
          bun test tests/b1-definitive-operator-architecture-14/failure-injection-14.test.ts

  # Executes the review-chain PG verifiers shipped under tests/ against a
  # disposable postgres:17 service. Each matrix leg gets its OWN cluster:
  # several setup files CREATE ROLE anon/authenticated unconditionally, so
  # chains cannot share one cluster (verified locally). Every leg applies its
  # fixture schema, then the migration DRAFT (source-only review artifact),
  # then the verifier (which rolls back). Fail-closed: ON_ERROR_STOP is forced
  # for every file; verifiers additionally \quit 1 when -v fixtures are absent.
  pg-verifiers:
    name: PG 17 verifier · ${{ matrix.chain.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        chain:
          # Chain: pg-setup -> GRADUATES-AFFAIRS-MVP-FOUNDATION-01 -> verifier.
          - name: graduates-affairs-foundation
            files: >-
              tests/graduates-affairs/graduates-affairs-foundation-01.pg-setup.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-FOUNDATION-01.sql
              tests/graduates-affairs/graduates-affairs-foundation-01.pg-verify.sql
          # Documented completion review chain: pg-setup -> foundation draft ->
          # GRADUATES-AFFAIRS-MVP-COMPLETION-01 -> completion verifier.
          - name: graduates-affairs-completion
            files: >-
              tests/graduates-affairs/graduates-affairs-foundation-01.pg-setup.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-FOUNDATION-01.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-COMPLETION-01.sql
              tests/graduates-affairs/graduates-affairs-completion-01.pg-verify.sql
          # Authorization review chain: own pg-setup (staff/assignment stub
          # schema) -> foundation draft -> completion draft ->
          # GRADUATES-AFFAIRS-AUTHORIZATION-04 -> authorization verifier.
          - name: graduates-affairs-authorization
            files: >-
              tests/graduates-affairs/graduates-affairs-authorization-04.pg-setup.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-FOUNDATION-01.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-COMPLETION-01.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-AUTHORIZATION-04.sql
              tests/graduates-affairs/graduates-affairs-authorization-04.pg-verify.sql
          # Targeted R6 concurrency: FOR SHARE serializes self-write vs revocation
          # (forward + reverse TOCTOU directions).
          - name: graduates-affairs-remediation-concurrency
            files: >-
              tests/graduates-affairs/graduates-affairs-authorization-04.pg-setup.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-FOUNDATION-01.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-COMPLETION-01.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-AUTHORIZATION-04.sql
              tests/graduates-affairs/graduates-affairs-remediation-concurrency-01.pg-verify.sql
          # Follow-up authority-loss concurrency: FOR SHARE on exact assignment /
          # profile / department authority rows (forward + reverse).
          - name: graduates-affairs-followup-authority-race
            files: >-
              tests/graduates-affairs/graduates-affairs-authorization-04.pg-setup.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-FOUNDATION-01.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-COMPLETION-01.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-AUTHORIZATION-04.sql
              tests/graduates-affairs/graduates-affairs-followup-authority-race-01.pg-verify.sql
          # Codex final HIGH-1/HIGH-2: direct-user active-staff + profile-bound scope.
          - name: graduates-affairs-codex-final-high-profile-binding
            files: >-
              tests/graduates-affairs/graduates-affairs-authorization-04.pg-setup.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-FOUNDATION-01.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-COMPLETION-01.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-AUTHORIZATION-04.sql
              tests/graduates-affairs/graduates-affairs-codex-final-high-profile-binding-03.pg-verify.sql
          # Qwen context RPC functional matrix (auth.uid()-driven actor behavior).
          - name: graduates-affairs-context-rpc-functional-matrix
            files: >-
              tests/graduates-affairs/graduates-affairs-authorization-04.pg-setup.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-FOUNDATION-01.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-MVP-COMPLETION-01.sql
              docs/migration-drafts/GRADUATES-AFFAIRS-AUTHORIZATION-04.sql
              tests/graduates-affairs/graduates-affairs-context-rpc-functional-matrix-04.pg-verify.sql
          # Chain: pg-setup -> DEPARTMENT-TRANSFER-ACADEMIC-CLEARANCE-
          # FOUNDATION-01 -> verifier.
          - name: academic-clearance-foundation
            files: >-
              tests/academic-clearance/academic-clearance.pg-setup.sql
              docs/migration-drafts/DEPARTMENT-TRANSFER-ACADEMIC-CLEARANCE-FOUNDATION-01.sql
              tests/academic-clearance/academic-clearance.pg-verify.sql
          # Chain: pg-setup -> foundation draft -> ACADEMIC-CLEARANCE-
          # COMPLETION-01 -> completion verifier (seven-status lifecycle).
          - name: academic-clearance-completion
            files: >-
              tests/academic-clearance/academic-clearance.pg-setup.sql
              docs/migration-drafts/DEPARTMENT-TRANSFER-ACADEMIC-CLEARANCE-FOUNDATION-01.sql
              docs/drafts/ACADEMIC-CLEARANCE-COMPLETION-01.sql
              tests/academic-clearance/academic-clearance-completion.pg-verify.sql
          # Chain: minimal schema -> canonical SET U (A1/A2/A3 + storage insert
          # predicate fix) -> foundation verifier. Production ledger is P1-U;
          # SET N is quarantined under docs/migration-evidence.
          - name: graduation-projects-foundation
            files: >-
              tests/graduation-projects/postgres-minimal-schema.sql
              supabase/migrations/20260806235348_8f36000d-c62c-416f-a84b-eeee7d400dd8.sql
              supabase/migrations/20260807000230_a6771356-c3f3-4cba-9b90-e3f70afbb72b.sql
              supabase/migrations/20260807001114_c22e6009-1472-43ef-9443-b002872bbba5.sql
              supabase/migrations/20260807023229_7adcb3fb-73a1-483c-8ca2-4c93645fb84b.sql
              tests/graduation-projects/postgres-foundation-verifier.sql
          # Chain: minimal schema -> canonical SET U -> foundation verifier ->
          # lifecycle (Package A) verifier.
          - name: graduation-projects-lifecycle
            files: >-
              tests/graduation-projects/postgres-minimal-schema.sql
              supabase/migrations/20260806235348_8f36000d-c62c-416f-a84b-eeee7d400dd8.sql
              supabase/migrations/20260807000230_a6771356-c3f3-4cba-9b90-e3f70afbb72b.sql
              supabase/migrations/20260807001114_c22e6009-1472-43ef-9443-b002872bbba5.sql
              supabase/migrations/20260807023229_7adcb3fb-73a1-483c-8ca2-4c93645fb84b.sql
              tests/graduation-projects/postgres-foundation-verifier.sql
              tests/graduation-projects/postgres-lifecycle-verifier.sql
          # Chain: minimal schema -> SET U -> storage remediation verifier
          # (retains dedicated storage INSERT policy proof).
          - name: graduation-projects-storage
            files: >-
              tests/graduation-projects/postgres-minimal-schema.sql
              supabase/migrations/20260806235348_8f36000d-c62c-416f-a84b-eeee7d400dd8.sql
              supabase/migrations/20260807000230_a6771356-c3f3-4cba-9b90-e3f70afbb72b.sql
              supabase/migrations/20260807001114_c22e6009-1472-43ef-9443-b002872bbba5.sql
              supabase/migrations/20260807023229_7adcb3fb-73a1-483c-8ca2-4c93645fb84b.sql
              tests/graduation-projects/postgres-storage-insert-policy-remediation-verifier.sql
          # Chain: minimal schema -> SET U -> promoted L4 -> L4 verifier.
          - name: graduation-projects-level4
            files: >-
              tests/graduation-projects/postgres-minimal-schema.sql
              supabase/migrations/20260806235348_8f36000d-c62c-416f-a84b-eeee7d400dd8.sql
              supabase/migrations/20260807000230_a6771356-c3f3-4cba-9b90-e3f70afbb72b.sql
              supabase/migrations/20260807001114_c22e6009-1472-43ef-9443-b002872bbba5.sql
              supabase/migrations/20260807023229_7adcb3fb-73a1-483c-8ca2-4c93645fb84b.sql
              supabase/migrations/20260808010000_gp_student_level4_only_eligibility_guard_01.sql
              tests/graduation-projects/postgres-student-level4-eligibility-guard-verifier.sql
          # Chain: GA authorization setup -> promoted Foundation ->
          # promoted Completion -> promoted AUTH04 -> post-verifier.
          - name: graduates-affairs-promotion-foundation
            files: >-
              tests/graduates-affairs/graduates-affairs-authorization-04.pg-setup.sql
              supabase/migrations/20260808210000_ga_mvp_foundation_01.sql
              tests/graduates-affairs/ga-production-promotion-post-verifier-foundation.sql
          - name: graduates-affairs-promotion-completion
            files: >-
              tests/graduates-affairs/graduates-affairs-authorization-04.pg-setup.sql
              supabase/migrations/20260808210000_ga_mvp_foundation_01.sql
              supabase/migrations/20260808210100_ga_mvp_completion_01.sql
              tests/graduates-affairs/ga-production-promotion-post-verifier-completion.sql
          - name: graduates-affairs-promotion-auth04
            files: >-
              tests/graduates-affairs/graduates-affairs-authorization-04.pg-setup.sql
              supabase/migrations/20260808210000_ga_mvp_foundation_01.sql
              supabase/migrations/20260808210100_ga_mvp_completion_01.sql
              supabase/migrations/20260808210200_ga_authorization_04.sql
              tests/graduates-affairs/ga-production-promotion-post-verifier-auth04.sql
          # Promoted AUTH04 + follow-up authority-loss concurrency (forward/reverse).
          - name: graduates-affairs-promotion-followup-authority-race
            files: >-
              tests/graduates-affairs/graduates-affairs-authorization-04.pg-setup.sql
              supabase/migrations/20260808210000_ga_mvp_foundation_01.sql
              supabase/migrations/20260808210100_ga_mvp_completion_01.sql
              supabase/migrations/20260808210200_ga_authorization_04.sql
              tests/graduates-affairs/graduates-affairs-followup-authority-race-01.pg-verify.sql
          # Chain: minimal schema -> 20260721000000_materials_secure_activation
          # draft -> secure activation verifier (38 assertion groups).
          - name: materials-secure-activation
            files: >-
              tests/materials/postgres-minimal-schema.sql
              docs/drafts/20260721000000_materials_secure_activation.draft.sql
              tests/materials/postgres-secure-activation-verifier.sql
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_verifier_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci_pg_verifier_password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Ensure psql client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Run chain (fail-closed)
        env:
          CHAIN_FILES: ${{ matrix.chain.files }}
          CHAIN_VARS: ${{ matrix.chain.vars }}
        run: |
          set -euo pipefail
          createdb chain_verify
          for f in $CHAIN_FILES; do
            echo "=== psql -f $f"
            # CHAIN_VARS intentionally word-splits into psql -v pairs.
            psql -q -v ON_ERROR_STOP=1 -d chain_verify $CHAIN_VARS -f "$f"
          done
          echo "chain '${{ matrix.chain.name }}': PASS"
