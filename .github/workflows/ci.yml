name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.*.json"
      - "eslint.config.js"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Install · Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (advisory)
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.lint?0:1)"; then
            set +e
            bun run lint
            LINT_EXIT=$?
            set -e
            if [ "$LINT_EXIT" -ne 0 ]; then
              MSG="Lint failed but is non-blocking during initial Production Hardening CI rollout. Formatting cleanup will be handled separately."
              echo "$MSG"
              echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Lint passed."
            fi
          else
            echo "No lint script in package.json — skipped."
          fi

      - name: Typecheck
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.typecheck?0:1)"; then
            bun run typecheck
          else
            echo "typecheck script not found; skipping"
            echo "typecheck script not found; skipping" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        if: ${{ hashFiles('package.json') != '' }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.build?0:1)"; then
            bun run build
          else
            echo "::error::No build script in package.json"
            exit 1
          fi
