name: Staging assurance tools

on:
  pull_request:
    paths:
      - "tests/security/assurance-02/**"
      - "tests/security/assurance-03/**"
      - ".github/workflows/assurance-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-assurance:
    name: Offline assurance tests and strict typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run offline assurance regressions
        run: bun test tests/security/assurance-02 tests/security/assurance-03
      - name: Check assurance script types
        run: bunx tsc --noEmit --noCheck false -p tests/security/assurance-02/tsconfig.json
      - name: Check grade and request assurance script types
        run: bunx tsc --noEmit --noCheck false -p tests/security/assurance-03/tsconfig.json
