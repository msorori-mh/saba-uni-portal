name: Credential print security

on:
  pull_request:
    paths:
      - "src/lib/credential-print-html.ts"
      - "src/components/admin/people/shared.tsx"
      - "src/routes/admin/students.lazy.tsx"
      - "tests/security/credential-print-html.test.ts"
      - ".github/workflows/credential-print-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Parse attack payloads and check admin dialog behavior
        run: bun test tests/security/credential-print-html.test.ts tests/admin/reset-password-dialog-open-close.test.ts
      - name: Strict typecheck of HTML interpolation
        run: bunx tsc --noEmit --noCheck false --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --types node src/lib/credential-print-html.ts
