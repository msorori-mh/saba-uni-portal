name: Production Runtime Preflight 04E

on:
  pull_request:
    paths:
      - ".github/workflows/production-runtime-preflight-04e.yml"
      - ".github/workflows/cloudflare-staging-04d.yml"
      - "src/integrations/supabase/deployment-profile.ts"
      - "src/integrations/supabase/staging-config.ts"
      - "src/integrations/supabase/staging-isolation.ts"
      - "src/integrations/supabase/auth-middleware.ts"
      - "src/integrations/supabase/client.server.ts"
      - "src/integrations/supabase/client.ts"
      - "src/lib/admin-users.functions.ts"
      - "src/lib/councils/request-auth.server.ts"
      - "tests/security/production-runtime-profile-04e.test.ts"
      - "tests/security/staging-publish-env-closure-03w.test.ts"
      - "tests/security/staging-supabase-isolation-03u.test.ts"
      - "tests/build-provenance/vite-config-provenance.test.ts"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-runtime-preflight-04e.yml"
      - ".github/workflows/cloudflare-staging-04d.yml"
      - "src/integrations/supabase/deployment-profile.ts"
      - "src/integrations/supabase/staging-config.ts"
      - "src/integrations/supabase/staging-isolation.ts"
      - "src/integrations/supabase/auth-middleware.ts"
      - "src/integrations/supabase/client.server.ts"
      - "src/integrations/supabase/client.ts"
      - "src/lib/admin-users.functions.ts"
      - "src/lib/councils/request-auth.server.ts"
      - "tests/security/production-runtime-profile-04e.test.ts"
      - "tests/security/staging-publish-env-closure-03w.test.ts"
      - "tests/security/staging-supabase-isolation-03u.test.ts"
      - "tests/build-provenance/vite-config-provenance.test.ts"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-runtime-preflight-04e-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_PORTAL_DEPLOY_TARGET: production
  VITE_SUPABASE_URL: https://wpmicqriltrowwonknox.supabase.co
  # Deliberately fake public-format value. This workflow never reads production secrets.
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_04e_preflight_only_not_a_credential

jobs:
  production-profile:
    name: Source-only production profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Run deployment isolation contracts
        run: |
          bun test \
            tests/security/staging-supabase-isolation-03u.test.ts \
            tests/security/staging-publish-env-closure-03w.test.ts \
            tests/security/cloudflare-staging-deployment-04d.test.ts \
            tests/security/production-runtime-profile-04e.test.ts \
            tests/build-provenance/vite-config-provenance.test.ts

      - name: Build source-only production profile
        env:
          GITHUB_SHA: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Verify generated production contract
        run: |
          set -euo pipefail
          node --import tsx scripts/validate-tanstack-route-tree-register.ts
          grep -R -q "wpmicqriltrowwonknox\.supabase\.co" .output
          if grep -R -E -q 'sb_secret_[A-Za-z0-9_-]{20,}|eyJhbGciOi[A-Za-z0-9_-]{20,}\.' .output; then
            echo "::error::Generated output contains a forbidden secret-shaped token"
            exit 1
          fi

      - name: Confirm source tree stayed clean
        run: git diff --exit-code
